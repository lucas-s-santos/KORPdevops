# Provisionamento dos datasources. Com este arquivo o Grafana já sobe
# apontando para o Prometheus e para o Loki — nada é configurado pela
# interface, então o ambiente é reprodutível e versionado em Git.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # O uid é fixo de propósito: o JSON do dashboard referencia este valor.
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Deve casar com o scrape_interval do Prometheus para que o Grafana
      # escolha passos de consulta coerentes nos gráficos.
      timeInterval: 15s
      httpMethod: POST
      # Liga o botão "Logs" nos painéis de série temporal: o Grafana leva o
      # intervalo de tempo selecionado no gráfico direto para o Loki. É o
      # caminho de dois cliques entre "o gráfico subiu" e "por quê".
      exemplarTraceIdDestinations: []

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    editable: false
    jsonData:
      # Teto de linhas por consulta. Alto demais trava o navegador quando
      # alguém esquece o filtro e pede a stack inteira.
      maxLines: 1000
      timeout: 60
      derivedFields:
        # Transforma o campo `alerta` dos logs do notificador num link que
        # abre o alerta correspondente no Prometheus. Log estruturado deixa
        # de ser texto e vira navegação.
        - name: alerta
          matcherType: label
          matcherRegex: "alerta"
          datasourceUid: prometheus
          url: 'ALERTS{alertname="${__value.raw}"}'
          urlDisplayLabel: "Ver alerta no Prometheus"
