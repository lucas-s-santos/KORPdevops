# ---------------------------------------------------------------------------
# Proxy reverso: host:80  ->  http-server-projeto-korp:8080
#
# Este arquivo é montado como volume em /etc/nginx/conf.d/ e é incluído pelo
# nginx.conf oficial dentro do contexto `http`.
# ---------------------------------------------------------------------------

# Log de acesso em JSON, com os tempos do upstream. `request_time` é o total
# visto pelo cliente e `upstream_response_time` é o gasto pela aplicação —
# a diferença entre os dois é o que separa "a app está lenta" de "a rede/o
# proxy está lento".
log_format korp_json escape=json
  '{'
    '"horario":"$time_iso8601",'
    '"cliente":"$remote_addr",'
    '"metodo":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
  '}';

# Rate limit: protege a aplicação de rajadas. 30 req/s por IP, com folga de 20.
limit_req_zone $binary_remote_addr zone=korp_limit:10m rate=30r/s;

# DNS embutido do Docker. Sem `resolver`, o NGINX resolveria o nome do
# container uma única vez na inicialização e continuaria apontando para um IP
# morto caso a aplicação fosse recriada. Com o resolver + a variável abaixo,
# o nome é reavaliado a cada 10s.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen      80 default_server;
    server_name localhost;

    # Não revelar a versão do NGINX no header Server e nas páginas de erro.
    server_tokens off;

    access_log /var/log/nginx/access.log korp_json;
    error_log  /var/log/nginx/error.log  warn;

    # O corpo das requisições aqui é sempre vazio; limitar evita upload abusivo.
    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    gzip             on;
    gzip_types       application/json;
    gzip_min_length  256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # A variável força a reavaliação do DNS a cada requisição (ver `resolver`).
    set $korp_upstream "http-server-projeto-korp";

    location / {
        limit_req zone=korp_limit burst=20 nodelay;

        proxy_pass http://$korp_upstream:8080$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Se a aplicação estiver reiniciando, tenta o próximo endereço em vez
        # de devolver 502 na cara do cliente.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # As probes não poluem o log de acesso.
    location = /healthz {
        access_log off;
        proxy_pass http://$korp_upstream:8080/healthz;
        proxy_set_header Host $host;
    }

    # /metrics é superfície interna: o Prometheus raspa a aplicação
    # diretamente pela rede Docker, sem passar por aqui. O acesso pelo proxy
    # fica restrito a redes privadas (útil para depurar do host).
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        access_log off;
        proxy_pass http://$korp_upstream:8080/metrics;
        proxy_set_header Host $host;
    }
}

# Endpoint de status do próprio NGINX, consumido pelo nginx-prometheus-exporter.
# Escuta na porta 8081, que não é publicada no host — só existe dentro da rede.
server {
    listen      8081;
    server_name _;

    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny  all;
    }

    location / {
        return 404;
    }
}
