# ---------------------------------------------------------------------------
# Projeto Korp — stack completa
#
#   host:80   -> nginx -> http-server-projeto-korp:8080   (somente rede interna)
#   host:9090 -> prometheus
#   host:3000 -> grafana
#   host:9093 -> alertmanager
#
# Caminho de um alerta, da métrica até o celular:
#
#   aplicação  -> /metrics
#   prometheus -> avalia prometheus/rules/*.yml
#   alertmanager -> agrupa, inibe o que é sintoma, roteia por severidade
#   notificador  -> vira log estruturado + métrica, e posta no Discord
#   promtail -> lê esse log -> loki -> aparece no mesmo Grafana do gráfico
#
# A chave `version:` foi omitida de propósito: está obsoleta no Compose V2 e
# só gera aviso na subida.
# ---------------------------------------------------------------------------

name: projeto-korp

# ---------------------------------------------------------------------------
# Âncoras YAML: rotação de log e política de restart definidas uma vez e
# reaproveitadas. Sem `max-size`, o log JSON de um container cresce até
# encher o disco do host — é uma das causas mais comuns de incidente bobo.
# ---------------------------------------------------------------------------
x-logging: &logging-padrao
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-padrao unless-stopped

services:
  # -------------------------------------------------------------------------
  # 1) A aplicação Go. NÃO publica portas no host: só é alcançável de dentro
  #    da rede korp-net, exatamente como pede o desafio.
  # -------------------------------------------------------------------------
  http-server-projeto-korp:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-1.0.0}
        COMMIT: ${APP_COMMIT:-local}
        BUILD_DATE: ${APP_BUILD_DATE:-unknown}
    image: http-server-projeto-korp:${APP_VERSION:-1.0.0}
    container_name: http-server-projeto-korp
    hostname: http-server-projeto-korp
    restart: *restart-padrao
    logging: *logging-padrao

    environment:
      LISTEN_ADDR: ":8080"
      LOG_LEVEL: "info"
      SERVICE_NAME: "http-server-projeto-korp"
      TZ: "UTC"

    # `expose` documenta a porta para leitores e ferramentas; ao contrário de
    # `ports`, não abre absolutamente nada no host.
    expose:
      - "8080"

    networks:
      - korp-net

    # O HEALTHCHECK já vem embutido na imagem; repetido aqui para ficar
    # explícito e para continuar funcionando se a imagem for trocada.
    healthcheck:
      test: ["CMD", "/http-server-projeto-korp", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Endurecimento: sem escalada de privilégio, sem capabilities e com o
    # sistema de arquivos somente leitura. A aplicação não escreve em disco.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M

  # -------------------------------------------------------------------------
  # 2) NGINX — a única porta publicada no host (80).
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    hostname: nginx
    restart: *restart-padrao
    logging: *logging-padrao

    ports:
      - "80:80"

    volumes:
      # Volume exigido pelo desafio. Em `:ro` porque o NGINX só precisa ler a
      # configuração; se o container for comprometido, não altera o host.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    networks:
      - korp-net

    # Só sobe depois que a aplicação passa no healthcheck: elimina a janela
    # de 502 logo após um `docker compose up`.
    depends_on:
      http-server-projeto-korp:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 3) Exporter que traduz o stub_status do NGINX para o formato Prometheus.
  # -------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    hostname: nginx-exporter
    restart: *restart-padrao
    logging: *logging-padrao

    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status

    expose:
      - "9113"

    networks:
      - korp-net

    depends_on:
      nginx:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 4) Blackbox exporter — sonda o serviço "de fora", como um usuário real.
  # -------------------------------------------------------------------------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    hostname: blackbox-exporter
    restart: *restart-padrao
    logging: *logging-padrao

    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --log.level=warn

    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

    expose:
      - "9115"

    networks:
      - korp-net

    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 5) Prometheus — coleta e armazena as séries temporais.
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    hostname: prometheus
    restart: *restart-padrao
    logging: *logging-padrao

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 31 dias: um a mais que a janela de 30 do SLO. Com 15d, a regra
      # korp:erro_requisicoes:ratio_rate30d calcularia a media de meia
      # janela e reportaria um SLO otimista.
      - --storage.tsdb.retention.time=31d
      # Permite recarregar a configuração com POST /-/reload, sem reiniciar.
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # Volume nomeado: as séries sobrevivem a `docker compose down`.
      - prometheus-data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - korp-net

    depends_on:
      - http-server-projeto-korp
      - blackbox-exporter

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 6) Grafana — visualização. Datasource e dashboard vêm provisionados por
  #    arquivo; nada é configurado à mão pela interface.
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    hostname: grafana
    restart: *restart-padrao
    logging: *logging-padrao

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Abre direto no dashboard do projeto ao entrar.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/http-server-projeto-korp-dashboard.json
      GF_LOG_LEVEL: warn

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

    ports:
      - "3000:3000"

    networks:
      - korp-net

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 7) Alertmanager — agrupa, inibe e entrega os alertas que o Prometheus
  #    dispara. Sem ele, as regras de prometheus/rules/ só acendem uma linha
  #    vermelha numa tela que ninguém está olhando às 3h da manhã.
  # -------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    hostname: alertmanager
    restart: *restart-padrao
    logging: *logging-padrao

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # A URL externa vai nos links das notificações. Sem ela o Alertmanager
      # monta os links com o hostname do container, que ninguém consegue
      # abrir do navegador do host.
      - --web.external-url=http://localhost:9093
      - --log.level=warn

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Volume nomeado: os silêncios criados durante um incidente sobrevivem
      # a um restart. Silêncio perdido no meio da madrugada = canal inundado
      # de novo, justamente quando alguém está tentando consertar.
      - alertmanager-data:/alertmanager

    ports:
      - "9093:9093"

    networks:
      - korp-net

    depends_on:
      notificador:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 8) Notificador — recebe o webhook do Alertmanager, registra o alerta em
  #    log estruturado, conta numa métrica e repassa ao Discord.
  #
  #    Roda a biblioteca padrão do Python sobre a imagem oficial: sem build,
  #    sem `pip install`, sem lockfile. O script é montado como volume, então
  #    o "deploy" dele é reiniciar o container.
  # -------------------------------------------------------------------------
  notificador:
    image: python:3.12-alpine
    container_name: notificador
    hostname: notificador
    restart: *restart-padrao
    logging: *logging-padrao

    # `-u` desliga o buffer de stdout: sem isso o log só apareceria quando o
    # buffer enchesse, e um alerta que chega com 4KB de atraso não serve.
    command: ["python", "-u", "/app/notificador.py"]

    environment:
      PORTA: "9094"
      # O único segredo da stack. Vazio = o alerta fica no log e na métrica e
      # nada quebra; é assim que o CI roda, sem precisar de credencial.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Sem isto o Python tenta gravar .pyc e esbarra no read_only abaixo.
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: "UTC"

    volumes:
      - ./notificador/notificador.py:/app/notificador.py:ro

    expose:
      - "9094"

    networks:
      - korp-net

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9094/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Mesmo endurecimento da aplicação Go: usuário sem privilégio, sem
    # capabilities, sistema de arquivos somente leitura.
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  # -------------------------------------------------------------------------
  # 9) Loki — armazena os logs. Métrica diz QUE quebrou; log diz POR QUÊ.
  #    Estando os dois no mesmo Grafana, o caminho entre as duas perguntas é
  #    de dois cliques, sem trocar de ferramenta no meio do incidente.
  # -------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    hostname: loki
    restart: *restart-padrao
    logging: *logging-padrao

    command: ["-config.file=/etc/loki/loki-config.yml"]

    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

    expose:
      - "3100"

    networks:
      - korp-net

    # Sem healthcheck de propósito: a imagem do Loki não garante um cliente
    # HTTP embutido (wget/curl), e healthcheck que depende de binário
    # incerto dentro da imagem quebra numa atualização de versão sem avisar.
    #
    # A prontidão é verificada de fora, por quem tem como verificar: o
    # Prometheus coleta o job `loki`, e tanto a role `validacao` quanto o
    # teste de aceitação exigem `up{job="loki"} == 1` e linhas efetivamente
    # entregues. Isso prova mais do que um healthcheck provaria — não só que
    # o processo respondeu, mas que o log está chegando.
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 10) Proxy do socket do Docker.
  #
  #     O Promtail precisa da API do Docker para descobrir os containers pelo
  #     NOME (pelo caminho em disco só existiria o ID, um hash que muda a
  #     cada recriação). Só que montar /var/run/docker.sock direto num
  #     container equivale a dar root no host para ele: quem fala com o
  #     socket cria container privilegiado e monta o filesystem inteiro.
  #
  #     Este proxy fica no meio e libera só o que o Promtail usa — leitura de
  #     containers. `POST=0` é a linha que importa: sem POST não se cria, não
  #     se para e não se executa nada.
  # -------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    hostname: docker-socket-proxy
    restart: *restart-padrao
    logging: *logging-padrao

    environment:
      # Necessários para o cliente Docker negociar a versão da API.
      PING: "1"
      VERSION: "1"
      # O que o Promtail realmente usa: listar containers e ler seus logs.
      CONTAINERS: "1"
      # E LER as redes. A descoberta do Promtail monta as labels
      # `__meta_docker_network_*` e consulta /networks para isso; sem esta
      # permissão a descoberta falha inteira com 403 ("error while computing
      # network labels"), mesmo com /containers liberado. É leitura: continua
      # não podendo criar nem alterar rede nenhuma.
      NETWORKS: "1"
      # Todo o resto fica fechado. `POST=0` é a linha que importa — sem POST
      # não se cria, não se para e não se executa nada, que é a razão de o
      # proxy existir.
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      INFO: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      NODES: "0"
      LOG_LEVEL: warning

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    expose:
      - "2375"

    networks:
      - korp-net

    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 11) Promtail — lê os logs dos containers e entrega ao Loki.
  # -------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    hostname: promtail
    restart: *restart-padrao
    logging: *logging-padrao

    command: ["-config.file=/etc/promtail/promtail-config.yml"]

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Guarda até onde cada log já foi lido. Em volume nomeado para que um
      # restart não reenvie tudo desde o início e duplique log no Loki.
      - promtail-data:/promtail

    expose:
      - "9080"

    networks:
      - korp-net

    # `service_started` e não `service_healthy` porque o Loki não expõe
    # estado de saúde (ver o comentário no serviço acima). O Promtail
    # aguenta o Loki ainda subindo: o `backoff_config` da configuração dele
    # tenta por ~5 minutos antes de descartar qualquer linha.
    depends_on:
      loki:
        condition: service_started
      docker-socket-proxy:
        condition: service_started

    # Não tem mais o socket do Docker (fala com o proxy pela rede), então
    # não precisa de capability nenhuma.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # 12) Gerador de carga (opcional) — só sobe com o perfil `carga`:
  #        docker compose --profile carga up -d
  #    Existe para os gráficos terem tráfego real durante a demonstração.
  # -------------------------------------------------------------------------
  gerador-de-carga:
    image: curlimages/curl:8.10.1
    container_name: gerador-de-carga
    restart: *restart-padrao
    logging: *logging-padrao
    profiles: ["carga"]

    networks:
      - korp-net

    depends_on:
      nginx:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "gerando trafego continuo contra o nginx..."
        while true; do
          curl -s -o /dev/null http://nginx/projeto-korp
          curl -s -o /dev/null http://nginx/healthz
          curl -s -o /dev/null http://nginx/rota-inexistente
          sleep 1
        done

# ---------------------------------------------------------------------------
# Rede bridge dedicada. Declarada como `external` porque é criada num passo
# anterior (pelo playbook Ansible ou por `make rede`), atendendo ao requisito
# de "criar a rede Docker" como etapa própria.
#
# Containers numa rede definida pelo usuário se enxergam pelo nome do serviço
# através do DNS interno do Docker (127.0.0.11) — é por isso que o NGINX
# consegue usar `http-server-projeto-korp` como hostname. Na rede `bridge`
# padrão isso não funcionaria: lá não há resolução por nome.
# ---------------------------------------------------------------------------
networks:
  korp-net:
    external: true
    name: korp-net

volumes:
  prometheus-data:
    name: projeto-korp-prometheus-data
  grafana-data:
    name: projeto-korp-grafana-data
  # Silencios e o estado de notificacao ("ja avisei sobre isto") do
  # Alertmanager. Perder este volume faz todo alerta ativo ser notificado de
  # novo do zero no proximo restart.
  alertmanager-data:
    name: projeto-korp-alertmanager-data
  loki-data:
    name: projeto-korp-loki-data
  promtail-data:
    name: projeto-korp-promtail-data
