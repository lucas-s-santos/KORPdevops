---
# ===========================================================================
# Role: stack — sobe os containers com Docker Compose
# ===========================================================================

- name: Subir a stack com Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ projeto_dir }}"
    project_name: projeto-korp
    files:
      - docker-compose.yml
    state: present
    # Recria containers cuja configuração mudou, sem tocar nos demais.
    recreate: auto
  register: resultado_compose

# A espera é feita aqui, e não pela opção `wait` do docker_compose_v2, de
# propósito: `wait` só existe a partir da community.docker 3.9.0, e o pacote
# `ansible` do Ubuntu 24.04 traz a 3.7.0. Como uma coleção instalada durante
# a execução não passa a valer no mesmo processo (o carregador de plugins já
# resolveu a versão antiga), depender de `wait` quebraria o requisito de
# provisionar tudo com UM único comando numa máquina recém-instalada.
#
# Esperar explicitamente ainda rende um erro melhor: diz QUAL container não
# ficou saudável, em vez de estourar um timeout genérico do Compose.
- name: Aguardar os containers ficarem saudáveis
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: estado_container
  until:
    - estado_container.exists | default(false)
    # Containers sem healthcheck (exporters) não têm State.Health; para eles
    # basta existirem e estarem em execução.
    - (estado_container.container.State.Health.Status | default('healthy')) == 'healthy'
    - estado_container.container.State.Running | default(false)
  retries: 36
  delay: 5
  loop:
    - http-server-projeto-korp
    - nginx
    - prometheus
    - grafana
    - blackbox-exporter
    - nginx-exporter
    - alertmanager
    - notificador
    - loki
    - promtail
    - docker-socket-proxy
  loop_control:
    label: "{{ item }}"

- name: Listar os containers em execução
  community.docker.docker_host_info:
    containers: true
    containers_filters:
      label: "com.docker.compose.project=projeto-korp"
  register: containers_ativos

- name: Exibir o estado dos containers
  ansible.builtin.debug:
    msg: >-
      {{ nome_container }} — {{ item.State | default('?') }}
      ({{ item.Status | default('?') }})
  vars:
    # A API do Docker devolve `Names` (lista); versões do módulo já
    # normalizaram para `Name`. O default cobre os dois formatos.
    nome_container: "{{ (item.Names | default([item.Name | default('?')])) | join(', ') }}"
  loop: "{{ containers_ativos.containers | default([]) }}"
  loop_control:
    label: "{{ nome_container }}"
