---
# Coleções usadas pelo playbook.
#
#   ansible-galaxy collection install -r requirements.yml
#
# O site.yml também instala o que estiver faltando automaticamente, para que
# o ambiente suba com um único comando.
collections:
  # Faixa testada. O piso não é decorativo:
  #   3.6.0 -> docker_image_build (build via buildx/BuildKit)
  #   3.9.0 -> docker_compose_v2 com wait/wait_timeout
  # O teto evita a 4.x, que remove módulos usados aqui sem aviso.
  - name: community.docker
    version: ">=3.10.0,<4.0.0"
  - name: community.general
    version: ">=8.0.0"
