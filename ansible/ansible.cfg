[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = False
stdout_callback      = yaml
# Mostra o resultado bonito também nas execuções em paralelo.
bin_ansible_callbacks = True
# Sem arquivos .retry sujando o repositório.
retry_files_enabled  = False
interpreter_python   = auto_silent
# Perfilamento: ao final da execução, lista as tarefas mais lentas.
callbacks_enabled    = profile_tasks
forks                = 10
display_skipped_hosts = False

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
# Reaproveita a conexão SSH entre tarefas: diferença enorme de tempo quando
# o alvo é remoto.
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey,password
