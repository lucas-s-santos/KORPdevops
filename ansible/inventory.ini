# ---------------------------------------------------------------------------
# Inventário
#
# Por padrão o playbook provisiona a PRÓPRIA máquina onde o Ansible roda
# (ansible_connection=local) — é o caso de uma VM ou WSL de desenvolvimento.
#
# Para provisionar um servidor remoto, comente o bloco local e descomente o
# bloco remoto abaixo. Nada mais no projeto precisa mudar: as roles não
# assumem em momento algum que o alvo é local.
# ---------------------------------------------------------------------------

[korp]
localhost ansible_connection=local

# [korp]
# servidor-korp ansible_host=192.168.0.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[korp:vars]
ansible_python_interpreter=/usr/bin/python3
