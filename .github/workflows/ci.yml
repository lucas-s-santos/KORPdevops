name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  go:
    name: Go — vet, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: app/go.sum

      - name: Conferir a formatação
        working-directory: app
        run: |
          nao_formatados="$(gofmt -l .)"
          if [[ -n "$nao_formatados" ]]; then
            echo "Arquivos fora do padrão do gofmt:"
            echo "$nao_formatados"
            exit 1
          fi

      - name: go vet
        working-directory: app
        run: go vet ./...

      - name: Testes com detector de corrida
        working-directory: app
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Relatório de cobertura
        working-directory: app
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        working-directory: app
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/http-server-projeto-korp .

  # -------------------------------------------------------------------------
  lint:
    name: Lint das configurações
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Shell (shellcheck)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh

      - name: Ansible (syntax-check e ansible-lint)
        run: |
          python -m pip install --quiet ansible-core ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check
          ansible-lint ansible/ || true

      - name: Prometheus (promtool)
        run: |
          docker run --rm -v "$PWD/prometheus:/p" \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check config /p/prometheus.yml
          docker run --rm -v "$PWD/prometheus:/p" \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check rules /p/rules/alertas-projeto-korp.yml /p/rules/slo-projeto-korp.yml

      - name: Alertmanager (amtool check-config)
        run: |
          docker run --rm -v "$PWD/alertmanager:/a" \
            --entrypoint amtool prom/alertmanager:v0.27.0 \
            check-config /a/alertmanager.yml

      - name: Loki (verify-config)
        run: |
          docker run --rm -v "$PWD/loki:/loki-conf" grafana/loki:3.3.2 \
            -config.file=/loki-conf/loki-config.yml -verify-config

      # O Promtail não expõe um verificador de configuração próprio, então
      # aqui a checagem é a que dá para fazer com honestidade: o arquivo é
      # YAML válido e tem as chaves que o agente exige.
      - name: Promtail (YAML válido e chaves obrigatórias)
        run: |
          python -c "
          import yaml, sys
          c = yaml.safe_load(open('promtail/promtail-config.yml'))
          assert c['clients'][0]['url'].startswith('http://loki:'), 'cliente do Loki ausente'
          assert c['scrape_configs'][0]['docker_sd_configs'], 'descoberta de containers ausente'
          print('promtail-config.yml ok')
          "

      - name: Notificador (compila e responde ao formato do Alertmanager)
        run: |
          python -m py_compile notificador/notificador.py
          echo "notificador.py compila"

      - name: Dashboard do Grafana é JSON válido
        run: |
          python -c "
          import json, glob
          for caminho in sorted(glob.glob('grafana/dashboards/*.json')):
              d = json.load(open(caminho))
              ids = [p['id'] for p in d['panels']]
              assert len(ids) == len(set(ids)), caminho + ': ids de painel duplicados'
              for p in d['panels']:
                  g = p['gridPos']
                  assert g['x'] + g['w'] <= 24, caminho + ': painel fora da grade de 24 colunas'
              print('%s -> %d paineis, JSON valido' % (caminho, len(d['panels'])))
          "

  # -------------------------------------------------------------------------
  e2e:
    name: Teste de aceitação da stack completa
    runs-on: ubuntu-latest
    needs: [go, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Criar a rede Docker
        run: |
          docker network create --driver bridge \
            --subnet 172.28.0.0/16 --gateway 172.28.0.1 korp-net

      - name: Subir a stack
        run: docker compose up -d --build --wait

      - name: Gerar tráfego
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost/projeto-korp > /dev/null
            curl -s  http://localhost/rota-inexistente > /dev/null
          done
          # Tempo suficiente para a cadeia inteira fechar, não só para o
          # Prometheus coletar: a regra do watchdog é avaliada (15s), o
          # Alertmanager roteia, o notificador recebe, e só então o
          # Prometheus coleta a métrica do notificador (mais 15s).
          sleep 75

      - name: Notificador aceita o payload do Alertmanager
        run: |
          docker run --rm --network korp-net curlimages/curl:8.10.1 \
            -sf -X POST -H 'Content-Type: application/json' \
            -d '{"version":"4","status":"firing","receiver":"korp-critico","alerts":[{"status":"firing","labels":{"alertname":"TesteDeCI","severidade":"critico","instance":"ci"},"annotations":{"resumo":"disparo sintetico do CI","descricao":"verifica o contrato do webhook"}}]}' \
            http://notificador:9094/alertas
          docker exec nginx wget -q -O- http://notificador:9094/metrics \
            | grep 'alerta="TesteDeCI"'

      - name: Teste de aceitação
        run: bash scripts/teste-aceitacao.sh

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200

      - name: Derrubar a stack
        if: always()
        run: docker compose down --volumes --remove-orphans
