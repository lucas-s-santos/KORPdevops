name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  go:
    name: Go — vet, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: app/go.sum

      - name: Conferir a formatação
        working-directory: app
        run: |
          nao_formatados="$(gofmt -l .)"
          if [[ -n "$nao_formatados" ]]; then
            echo "Arquivos fora do padrão do gofmt:"
            echo "$nao_formatados"
            exit 1
          fi

      - name: go vet
        working-directory: app
        run: go vet ./...

      - name: Testes com detector de corrida
        working-directory: app
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Relatório de cobertura
        working-directory: app
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        working-directory: app
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/http-server-projeto-korp .

  # -------------------------------------------------------------------------
  lint:
    name: Lint das configurações
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Shell (shellcheck)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh

      - name: Ansible (syntax-check e ansible-lint)
        run: |
          python -m pip install --quiet ansible-core ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check
          ansible-lint ansible/ || true

      - name: Prometheus (promtool)
        run: |
          docker run --rm -v "$PWD/prometheus:/p" \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check config /p/prometheus.yml
          docker run --rm -v "$PWD/prometheus:/p" \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check rules /p/rules/alertas-projeto-korp.yml

      - name: Dashboard do Grafana é JSON válido
        run: |
          python -c "import json; json.load(open('grafana/dashboards/http-server-projeto-korp-dashboard.json')); print('JSON válido')"

  # -------------------------------------------------------------------------
  e2e:
    name: Teste de aceitação da stack completa
    runs-on: ubuntu-latest
    needs: [go, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Criar a rede Docker
        run: |
          docker network create --driver bridge \
            --subnet 172.28.0.0/16 --gateway 172.28.0.1 korp-net

      - name: Subir a stack
        run: docker compose up -d --build --wait

      - name: Gerar tráfego
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost/projeto-korp > /dev/null
            curl -s  http://localhost/rota-inexistente > /dev/null
          done
          # Dá tempo do Prometheus fazer pelo menos duas coletas.
          sleep 35

      - name: Teste de aceitação
        run: bash scripts/teste-aceitacao.sh

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200

      - name: Derrubar a stack
        if: always()
        run: docker compose down --volumes --remove-orphans
